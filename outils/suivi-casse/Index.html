<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --fond: #faf6ef; --carte: #ffffff; --encre: #2b2620; --doux: #7a6f62;
    --bord: #e4dccf; --accent: #8c2f1b; --accent-clair: #f6e3dc; --ok: #2f6b3a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--fond); color: var(--encre); }
  header { position: sticky; top: 0; z-index: 2; background: var(--accent); color: #fff;
           display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
  header h1 { font-size: 18px; margin: 0; }
  nav button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.5);
               border-radius: 999px; padding: 6px 12px; font-size: 14px; margin-left: 6px; }
  nav button[aria-pressed="true"] { background: #fff; color: var(--accent); }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  section.bloc { background: var(--carte); border: 1px solid var(--bord); border-radius: 14px;
                 padding: 14px; margin-bottom: 14px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--doux); margin: 0 0 10px; }
  .photo { display: flex; flex-direction: column; align-items: center; justify-content: center;
           min-height: 180px; border: 2px dashed var(--bord); border-radius: 12px; cursor: pointer;
           color: var(--doux); text-align: center; overflow: hidden; }
  .photo img { width: 100%; max-height: 320px; object-fit: cover; display: block; }
  .photo .icone { font-size: 44px; }
  input[type=file] { display: none; }
  .tuiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .tuiles button { min-height: 52px; padding: 8px; border-radius: 10px; border: 1px solid var(--bord);
                   background: #fff; font-size: 15px; color: var(--encre); }
  .tuiles button[aria-pressed="true"] { background: var(--accent-clair); border-color: var(--accent);
                                        color: var(--accent); font-weight: 600; }
  .quantite { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .quantite button { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--bord);
                     background: #fff; font-size: 28px; color: var(--accent); }
  .quantite output { font-size: 34px; font-weight: 700; min-width: 2ch; text-align: center; }
  select, textarea, input[type=password] { width: 100%; font: inherit; padding: 12px; border-radius: 10px;
                     border: 1px solid var(--bord); background: #fff; color: var(--encre); }
  textarea { min-height: 70px; resize: vertical; }
  .envoyer { width: 100%; padding: 16px; font-size: 18px; font-weight: 700; border: 0; border-radius: 12px;
             background: var(--accent); color: #fff; }
  .envoyer:disabled { opacity: .5; }
  .message { padding: 12px; border-radius: 10px; margin-bottom: 14px; display: none; }
  .message.ok { display: block; background: #e5f1e7; color: var(--ok); }
  .message.erreur { display: block; background: var(--accent-clair); color: var(--accent); }
  .chiffres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .chiffres div { background: var(--fond); border-radius: 10px; padding: 10px 4px; }
  .chiffres strong { display: block; font-size: 22px; }
  .chiffres span { font-size: 12px; color: var(--doux); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td { padding: 7px 0; border-bottom: 1px solid var(--bord); }
  td.n { text-align: right; white-space: nowrap; padding-left: 10px; }
  .discret { color: var(--doux); font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Casse</h1>
  <nav>
    <button id="ongletDeclarer" aria-pressed="true">Déclarer</button>
    <button id="ongletBilan" aria-pressed="false">Bilan du mois</button>
  </nav>
</header>

<main>
  <div id="message" class="message" role="status"></div>

  <!-- ======== Déclaration ======== -->
  <form id="vueDeclarer" novalidate>
    <section class="bloc">
      <h2>1. Photo</h2>
      <label class="photo" id="zonePhoto" for="photo">
        <span class="icone">📷</span>
        <span>Touchez pour photographier l'objet cassé</span>
      </label>
      <input type="file" id="photo" accept="image/*" capture="environment">
    </section>

    <section class="bloc">
      <h2>2. Objet</h2>
      <div class="tuiles" id="objets"><span class="discret">Chargement…</span></div>
    </section>

    <section class="bloc">
      <h2>3. Quantité</h2>
      <div class="quantite">
        <button type="button" id="moins" aria-label="Moins">−</button>
        <output id="quantite">1</output>
        <button type="button" id="plus" aria-label="Plus">+</button>
      </div>
    </section>

    <section class="bloc">
      <h2>4. Où ?</h2>
      <div class="tuiles" id="lieux"></div>
    </section>

    <section class="bloc">
      <h2>5. Comment ?</h2>
      <div class="tuiles" id="causes"></div>
    </section>

    <section class="bloc">
      <h2>6. Service et déclarant</h2>
      <div class="tuiles" id="services" style="margin-bottom:10px"></div>
      <select id="declarant"><option value="">Déclaré par… (facultatif)</option></select>
    </section>

    <section class="bloc">
      <h2>7. Commentaire (facultatif)</h2>
      <textarea id="commentaire" maxlength="500" placeholder="Ex. : plateau renversé table 12, coup de feu"></textarea>
    </section>

    <section class="bloc" id="blocPin" hidden>
      <h2>Code</h2>
      <input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="Code à 4 chiffres">
    </section>

    <button type="submit" class="envoyer" id="envoyer">Enregistrer la casse</button>
    <p class="discret" style="text-align:center">La photo est rangée dans Google Drive et la casse ajoutée au registre.</p>
  </form>

  <!-- ======== Bilan ======== -->
  <div id="vueBilan" hidden>
    <section class="bloc">
      <h2 id="titreBilan">Ce mois-ci</h2>
      <div class="chiffres">
        <div><strong id="bDecl">–</strong><span>déclarations</span></div>
        <div><strong id="bPieces">–</strong><span>pièces</span></div>
        <div><strong id="bCout">–</strong><span>coût</span></div>
      </div>
    </section>
    <section class="bloc"><h2>Par objet</h2><table id="tObjets"></table></section>
    <section class="bloc"><h2>Par lieu</h2><table id="tLieux"></table></section>
    <section class="bloc"><h2>Par cause</h2><table id="tCauses"></table></section>
  </div>
</main>

<script>
  const etat = { objet: '', lieu: '', cause: '', service: '', quantite: 1, photo: '', reglages: null };
  const $ = id => document.getElementById(id);
  const euros = n => n.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });


  function afficherMessage(texte, type) {
    const m = $('message');
    m.textContent = texte;
    m.className = 'message ' + type;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /** Crée une rangée de tuiles à choix unique. */
  function tuiles(conteneur, valeurs, cle, libelle) {
    conteneur.textContent = '';
    valeurs.forEach(v => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = libelle ? libelle(v) : v;
      b.setAttribute('aria-pressed', String(etat[cle] === v));
      b.addEventListener('click', () => {
        etat[cle] = etat[cle] === v ? '' : v;
        [...conteneur.children].forEach(x => x.setAttribute('aria-pressed', 'false'));
        if (etat[cle]) b.setAttribute('aria-pressed', 'true');
      });
      conteneur.appendChild(b);
    });
  }

  function construireFormulaire(r) {
    etat.reglages = r;
    const couts = Object.fromEntries(r.objets.map(o => [o.nom, o.cout]));
    tuiles($('objets'), r.objets.map(o => o.nom), 'objet',
      nom => couts[nom] ? nom + ' · ' + euros(couts[nom]) : nom);
    tuiles($('lieux'), r.lieux, 'lieu');
    tuiles($('causes'), r.causes, 'cause');
    etat.service = new Date().getHours() >= r.heureSoir ? 'Soir' : 'Midi';
    tuiles($('services'), ['Midi', 'Soir'], 'service');

    const sel = $('declarant');
    sel.length = 1;
    r.personnel.forEach(p => sel.add(new Option(p, p)));
    sel.value = ''; // repart de « facultatif » à chaque déclaration : rien n'est présélectionné
    $('blocPin').hidden = !r.pinRequis;
  }

  /** Réduit la photo (1600 px max, JPEG 80 %) pour un envoi rapide même en 4G faible. */
  function compresser(fichier) {
    return new Promise((ok, ko) => {
      const img = new Image();
      img.onload = () => {
        const max = 1600;
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        ok(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = () => ko(new Error('Photo illisible.'));
      img.src = URL.createObjectURL(fichier);
    });
  }

  $('photo').addEventListener('change', async e => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const dataUrl = await compresser(f);
      etat.photo = dataUrl.split(',')[1];
      const zone = $('zonePhoto');
      zone.textContent = '';
      const img = document.createElement('img');
      img.src = dataUrl;
      img.alt = 'Aperçu de la photo';
      zone.appendChild(img);
    } catch (err) {
      afficherMessage(err.message, 'erreur');
    }
  });

  $('moins').onclick = () => { etat.quantite = Math.max(1, etat.quantite - 1); $('quantite').value = etat.quantite; };
  $('plus').onclick = () => { etat.quantite = Math.min(500, etat.quantite + 1); $('quantite').value = etat.quantite; };

  function reinitialiser() {
    Object.assign(etat, { objet: '', lieu: '', cause: '', quantite: 1, photo: '' });
    $('quantite').value = 1;
    $('commentaire').value = '';
    $('photo').value = '';
    $('zonePhoto').innerHTML = '<span class="icone">📷</span><span>Touchez pour photographier l\'objet cassé</span>';
    construireFormulaire(etat.reglages);
  }

  $('vueDeclarer').addEventListener('submit', e => {
    e.preventDefault();
    if (!etat.objet) return afficherMessage('Choisissez l\'objet cassé.', 'erreur');
    if (!etat.photo && !confirm('Aucune photo. Enregistrer quand même ?')) return;

    const declarant = $('declarant').value;
    const bouton = $('envoyer');
    bouton.disabled = true;
    bouton.textContent = 'Envoi en cours…';

    google.script.run
      .withSuccessHandler(r => {
        bouton.disabled = false;
        bouton.textContent = 'Enregistrer la casse';
        afficherMessage('Casse n° ' + r.numero + ' enregistrée' +
          (r.coutTotal ? ' (' + euros(r.coutTotal) + ')' : '') + '. Merci !', 'ok');
        reinitialiser();
      })
      .withFailureHandler(err => {
        bouton.disabled = false;
        bouton.textContent = 'Enregistrer la casse';
        afficherMessage('Échec de l\'envoi : ' + err.message, 'erreur');
      })
      .enregistrerCasse({
        pin: $('pin').value,
        photo: etat.photo,
        objet: etat.objet,
        quantite: etat.quantite,
        lieu: etat.lieu,
        cause: etat.cause,
        service: etat.service,
        declarant,
        commentaire: $('commentaire').value,
      });
  });

  /* ---------- Bilan ---------- */
  function remplirTable(table, donnees) {
    table.textContent = '';
    const lignes = Object.entries(donnees).sort((a, b) => b[1].cout - a[1].cout || b[1].pieces - a[1].pieces);
    if (!lignes.length) {
      table.innerHTML = '<tr><td class="discret">Aucune casse enregistrée.</td></tr>';
      return;
    }
    lignes.forEach(([nom, v]) => {
      const tr = table.insertRow();
      tr.insertCell().textContent = nom;
      const q = tr.insertCell(); q.className = 'n'; q.textContent = v.pieces + ' pc';
      const c = tr.insertCell(); c.className = 'n'; c.textContent = euros(v.cout);
    });
  }

  function chargerBilan() {
    $('bDecl').textContent = $('bPieces').textContent = $('bCout').textContent = '…';
    google.script.run
      .withSuccessHandler(b => {
        const [a, m] = b.mois.split('-');
        $('titreBilan').textContent = new Date(a, m - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
        $('bDecl').textContent = b.declarations;
        $('bPieces').textContent = b.pieces;
        $('bCout').textContent = euros(b.cout);
        remplirTable($('tObjets'), b.parObjet);
        remplirTable($('tLieux'), b.parLieu);
        remplirTable($('tCauses'), b.parCause);
      })
      .withFailureHandler(err => afficherMessage('Bilan indisponible : ' + err.message, 'erreur'))
      .getBilan();
  }

  function montrer(vue) {
    const bilan = vue === 'bilan';
    $('vueDeclarer').hidden = bilan;
    $('vueBilan').hidden = !bilan;
    $('ongletDeclarer').setAttribute('aria-pressed', String(!bilan));
    $('ongletBilan').setAttribute('aria-pressed', String(bilan));
    $('message').className = 'message';
    if (bilan) chargerBilan();
  }
  $('ongletDeclarer').onclick = () => montrer('declarer');
  $('ongletBilan').onclick = () => montrer('bilan');

  google.script.run
    .withSuccessHandler(construireFormulaire)
    .withFailureHandler(err => afficherMessage('Impossible de charger les listes : ' + err.message, 'erreur'))
    .getReglages();
</script>
</body>
</html>
